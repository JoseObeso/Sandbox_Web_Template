<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro móvil</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <main class="container py-4">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-7 col-lg-5">
        <div class="card border-0 shadow-sm rounded-4">
          <div class="card-body p-4">
            <h1 class="h3 text-center mb-1">Crear cuenta</h1>
            <p class="text-center text-secondary mb-4">Completa tus datos de registro</p>

            <form>
              <div class="mb-3">
                <label for="nombre" class="form-label">Nombre completo</label>
                <input type="text" class="form-control form-control-lg" id="nombre" placeholder="Tu nombre" required>
              </div>

              <div class="mb-3">
                <label for="correo" class="form-label">Correo electrónico</label>
                <input type="email" class="form-control form-control-lg" id="correo" placeholder="nombre@ejemplo.com" required>
              </div>

              <div class="mb-4">
                <label for="fechaRegistro" class="form-label">Fecha de registro</label>
                <input type="date" class="form-control form-control-lg" id="fechaRegistro" name="fechaRegistro" required>
                <div class="form-text">Selecciona la fecha en la que deseas registrarte.</div>
              </div>

              <button type="submit" class="btn btn-primary btn-lg w-100">Registrarme</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
