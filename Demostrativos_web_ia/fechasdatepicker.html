<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fechas - Datepicker</title>
  <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1rem;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }
    .card {
      width: min(100%, 420px);
      padding: clamp(1.25rem, 5vw, 2rem);
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 8px 25px rgb(15 23 42 / 12%);
    }
    h1 { margin: 0 0 .5rem; font-size: clamp(1.35rem, 5vw, 1.8rem); }
    p { margin: 0 0 1.5rem; color: #64748b; }
    label { display: block; margin-bottom: .45rem; font-weight: 600; }
    .campo { position: relative; }
    input[type="text"] {
      width: 100%;
      min-height: 44px;
      padding: .7rem 2.75rem .7rem .8rem;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 1rem;
    }
    input:focus { outline: 3px solid rgb(37 99 235 / 20%); border-color: #2563eb; }
    .icono { position: absolute; right: .8rem; top: .7rem; pointer-events: none; }
    .ui-datepicker { max-width: calc(100vw - 2rem); }
    @media (max-width: 360px) { .ui-datepicker { font-size: .85rem; } }
  </style>
</head>
<body>
  <main class="card">
    <h1>Selecciona una fecha</h1>
    <p>Elige una fecha en formato español.</p>
    <label for="fecha">Fecha</label>
    <div class="campo">
      <input type="text" id="fecha" name="fecha" placeholder="dd/mm/yyyy" autocomplete="off" readonly>
      <span class="icono" aria-hidden="true">📅</span>
    </div>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
  <script>
    $(function () {
      $.datepicker.regional.es = {
        closeText: 'Cerrar', prevText: 'Anterior', nextText: 'Siguiente',
        currentText: 'Hoy', monthNames: ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'],
        monthNamesShort: ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'],
        dayNames: ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'],
        dayNamesShort: ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'],
        dayNamesMin: ['Do', 'Lu', 'Ma', 'Mi', 'Ju', 'Vi', 'Sá'],
        weekHeader: 'Sm', dateFormat: 'dd/mm/yy', firstDay: 1, isRTL: false, showMonthAfterYear: false, yearSuffix: ''
      };
      $.datepicker.setDefaults($.datepicker.regional.es);
      $('#fecha').datepicker({ changeMonth: true, changeYear: true, yearRange: 'c-100:c+10' });
    });
  </script>
</body>
</html>
