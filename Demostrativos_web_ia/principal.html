<!doctype html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Registro de usuarios</title>
	<style>
		* { box-sizing: border-box; }
		body { min-height: 100vh; margin: 0; padding: 24px; display: grid; place-items: center; background: #f1f5f9; color: #172033; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
		.card { width: min(100%, 480px); padding: 36px; border: 1px solid #e2e8f0; border-radius: 18px; background: #fff; box-shadow: 0 16px 45px rgb(15 23 42 / 9%); }
		.brand { margin: 0 0 24px; color: #4f46e5; font-size: 14px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; }
		h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: -.04em; }
		.subtitle { margin: 0 0 26px; color: #64748b; font-size: 14px; }
		form { display: grid; gap: 17px; }
		.row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
		label { display: block; margin-bottom: 7px; font-size: 13px; font-weight: 650; }
		input:not([type="checkbox"]) { width: 100%; height: 44px; padding: 0 12px; border: 1px solid #cbd5e1; border-radius: 8px; background: #fff; color: inherit; font: inherit; font-size: 14px; }
		input:focus { outline: 3px solid rgb(79 70 229 / 18%); border-color: #4f46e5; }
		input::placeholder { color: #94a3b8; }
		.terms { display: flex; align-items: flex-start; gap: 9px; color: #475569; font-size: 12px; line-height: 1.5; }
		.terms input { margin: 2px 0 0; accent-color: #4f46e5; }
		a { color: #4f46e5; font-weight: 600; text-decoration: none; }
		a:hover { text-decoration: underline; }
		button { min-height: 46px; border: 0; border-radius: 8px; background: #4f46e5; color: #fff; cursor: pointer; font: inherit; font-size: 14px; font-weight: 700; }
		button:hover { background: #4338ca; }
		.login { margin: 22px 0 0; color: #64748b; text-align: center; font-size: 13px; }
		@media (max-width: 520px) { body { padding: 14px; } .card { padding: 27px 21px; } }
		@media (max-width: 380px) { .row { grid-template-columns: 1fr; } h1 { font-size: 25px; } }
	</style>
</head>
<body>
	<main class="card">
		<p class="brand">Nexo</p>
		<h1>Crear una cuenta</h1>
		<p class="subtitle">Regístrate para comenzar. Completa tus datos a continuación.</p>
		<form action="#" method="post">
			<div class="row">
				<div><label for="nombre">Nombre</label><input id="nombre" name="nombre" type="text" autocomplete="given-name" placeholder="Tu nombre" required></div>
				<div><label for="apellido">Apellido</label><input id="apellido" name="apellido" type="text" autocomplete="family-name" placeholder="Tu apellido" required></div>
			</div>
			<div><label for="correo">Correo electrónico</label><input id="correo" name="correo" type="email" autocomplete="email" placeholder="nombre@correo.com" required></div>
			<div><label for="usuario">Nombre de usuario</label><input id="usuario" name="usuario" type="text" autocomplete="username" minlength="3" placeholder="Elige tu usuario" required></div>
			<div class="row">
				<div><label for="contrasena">Contraseña</label><input id="contrasena" name="contrasena" type="password" autocomplete="new-password" minlength="8" placeholder="Mínimo 8 caracteres" required></div>
				<div><label for="confirmar">Confirmar contraseña</label><input id="confirmar" name="confirmar" type="password" autocomplete="new-password" minlength="8" placeholder="Repite la contraseña" required></div>
			</div>
			<div class="terms"><input id="aceptar" name="aceptar" type="checkbox" required><label for="aceptar">Acepto los <a href="#terminos">términos y condiciones</a> y la <a href="#privacidad">política de privacidad</a>.</label></div>
			<button type="submit">Crear cuenta</button>
		</form>
		<p class="login">¿Ya tienes una cuenta? <a href="#iniciar-sesion">Inicia sesión</a></p>
	</main>
</body>
</html>
