<!doctype html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Mi aplicación móvil</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
	<style>
		body { background: #f5f7fb; padding-bottom: 76px; }
		.app-header { background: linear-gradient(135deg, #4f46e5, #7c3aed); }
		.panel-card { border: 0; border-radius: 1rem; box-shadow: 0 4px 18px rgba(30, 41, 59, .08); }
		.icon-box { width: 44px; height: 44px; display: grid; place-items: center; border-radius: .8rem; }
		.bottom-nav { background: rgba(255,255,255,.96); box-shadow: 0 -3px 15px rgba(15,23,42,.08); }
		.bottom-nav a { color: #64748b; text-decoration: none; font-size: .75rem; }
		.bottom-nav a.active { color: #4f46e5; }
	</style>
</head>
<body>
	<header class="app-header text-white">
		<div class="container py-4">
			<div class="d-flex justify-content-between align-items-center mb-4">
				<div>
					<small class="opacity-75">Buenos días</small>
					<h1 class="h4 mb-0 fw-bold">Hola, Andrea</h1>
				</div>
				<button class="btn btn-light rounded-circle position-relative" aria-label="Notificaciones">
					<i class="bi bi-bell"></i><span class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-light rounded-circle"></span>
				</button>
			</div>
			<div class="input-group">
				<span class="input-group-text bg-white border-0"><i class="bi bi-search text-secondary"></i></span>
				<input type="search" class="form-control border-0" placeholder="Buscar en la aplicación">
			</div>
		</div>
	</header>

	<main class="container py-4">
		<div class="d-flex justify-content-between align-items-center mb-3">
			<h2 class="h5 fw-bold mb-0">Resumen</h2>
			<a href="#" class="small text-primary text-decoration-none">Ver todo</a>
		</div>
		<div class="row g-3 mb-4">
			<div class="col-6"><div class="card panel-card p-3 h-100"><div class="icon-box bg-primary-subtle text-primary mb-3"><i class="bi bi-bar-chart-fill"></i></div><small class="text-secondary">Progreso</small><strong class="fs-4">78%</strong><small class="text-success"><i class="bi bi-arrow-up"></i> 12% este mes</small></div></div>
			<div class="col-6"><div class="card panel-card p-3 h-100"><div class="icon-box bg-success-subtle text-success mb-3"><i class="bi bi-check2-circle"></i></div><small class="text-secondary">Completadas</small><strong class="fs-4">24</strong><small class="text-secondary">de 30 tareas</small></div></div>
		</div>

		<h2 class="h5 fw-bold mb-3">Acciones rápidas</h2>
		<div class="card panel-card mb-4"><div class="card-body">
			<div class="row g-3 text-center">
				<div class="col-4"><a href="#" class="text-decoration-none text-dark"><div class="icon-box bg-warning-subtle text-warning mx-auto mb-2"><i class="bi bi-plus-lg"></i></div><small>Nueva tarea</small></a></div>
				<div class="col-4"><a href="#" class="text-decoration-none text-dark"><div class="icon-box bg-info-subtle text-info mx-auto mb-2"><i class="bi bi-calendar3"></i></div><small>Calendario</small></a></div>
				<div class="col-4"><a href="#" class="text-decoration-none text-dark"><div class="icon-box bg-danger-subtle text-danger mx-auto mb-2"><i class="bi bi-people"></i></div><small>Equipo</small></a></div>
			</div>
		</div></div>

		<h2 class="h5 fw-bold mb-3">Actividad reciente</h2>
		<div class="card panel-card"><div class="list-group list-group-flush">
			<div class="list-group-item border-0 d-flex align-items-center gap-3 py-3"><div class="icon-box bg-primary-subtle text-primary"><i class="bi bi-file-earmark-text"></i></div><div class="flex-grow-1"><strong class="d-block">Informe mensual</strong><small class="text-secondary">Actualizado hace 10 min</small></div><i class="bi bi-three-dots-vertical text-secondary"></i></div>
			<div class="list-group-item border-0 d-flex align-items-center gap-3 py-3"><div class="icon-box bg-success-subtle text-success"><i class="bi bi-person-check"></i></div><div class="flex-grow-1"><strong class="d-block">Reunión de equipo</strong><small class="text-secondary">Completada ayer</small></div><i class="bi bi-three-dots-vertical text-secondary"></i></div>
			<div class="list-group-item border-0 d-flex align-items-center gap-3 py-3"><div class="icon-box bg-warning-subtle text-warning"><i class="bi bi-lightbulb"></i></div><div class="flex-grow-1"><strong class="d-block">Nueva idea añadida</strong><small class="text-secondary">Hace 2 días</small></div><i class="bi bi-three-dots-vertical text-secondary"></i></div>
		</div></div>
	</main>

	<nav class="bottom-nav fixed-bottom border-top"><div class="container d-flex justify-content-around py-2">
		<a href="#" class="active text-center"><i class="bi bi-house-fill d-block fs-5"></i>Inicio</a>
		<a href="#" class="text-center"><i class="bi bi-grid d-block fs-5"></i>Explorar</a>
		<a href="#" class="text-center"><i class="bi bi-chat d-block fs-5"></i>Mensajes</a>
		<a href="#" class="text-center"><i class="bi bi-person d-block fs-5"></i>Perfil</a>
	</div></nav>
</body>
</html>
