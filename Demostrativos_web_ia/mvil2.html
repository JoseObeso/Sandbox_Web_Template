<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>

  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css" />
  <style>
    :root {
      --rojo-principal: #d71920;
      --rojo-oscuro: #a70f17;
      --gris-fondo: #efefef;
      --gris-medio: #d1d1d1;
      --gris-texto: #444;
      --blanco: #ffffff;
    }

    html, body {
      height: 100%;
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, var(--gris-fondo) 0%, #f7f7f7 100%);
      color: var(--gris-texto);
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-wrapper {
      width: 100%;
      max-width: 420px;
    }

    .login-box {
      background: var(--blanco);
      border-radius: 14px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.12);
      border: 1px solid rgba(0, 0, 0, 0.06);
      overflow: hidden;
    }

    .login-header {
      background: linear-gradient(135deg, var(--rojo-principal), var(--rojo-oscuro));
      color: var(--blanco);
      text-align: center;
      padding: 26px 20px 18px;
    }

    .login-header .logo {
      display: inline-block;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      line-height: 72px;
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 10px;
      border: 2px solid rgba(255, 255, 255, 0.4);
    }

    .login-header h2 {
      margin: 0;
      font-size: 26px;
      letter-spacing: 0.5px;
      font-weight: 700;
    }

    .login-body {
      padding: 28px 30px 22px;
      background: #f9f9f9;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-control {
      height: 46px;
      border-radius: 8px;
      border: 1px solid var(--gris-medio);
      box-shadow: none;
      font-size: 15px;
      color: var(--gris-texto);
      background: var(--blanco);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .form-control:focus {
      border-color: var(--rojo-principal);
      box-shadow: 0 0 0 3px rgba(215, 25, 32, 0.12);
    }

    .input-group-addon {
      background: #efefef;
      border-color: var(--gris-medio);
      color: var(--rojo-principal);
      font-weight: bold;
    }

    .btn-login {
      width: 100%;
      height: 46px;
      border: none;
      border-radius: 8px;
      background: var(--rojo-principal);
      color: var(--blanco);
      font-size: 16px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: all 0.2s ease;
    }

    .btn-login:hover,
    .btn-login:focus {
      background: var(--rojo-oscuro);
      color: var(--blanco);
    }

    .login-footer {
      margin-top: 18px;
      text-align: center;
      color: #666;
      font-size: 12px;
    }

    .login-footer a {
      color: var(--rojo-principal);
      text-decoration: none;
      font-weight: 600;
    }

    .login-footer a:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      body {
        padding: 12px;
      }

      .login-header {
        padding: 22px 16px 14px;
      }

      .login-header h2 {
        font-size: 22px;
      }

      .login-body {
        padding: 22px 18px 18px;
      }

      .form-control,
      .btn-login {
        height: 42px;
      }
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-box">
      <div class="login-header">
        <div class="logo">L</div>
        <h2>Iniciar sesión</h2>
      </div>

      <div class="login-body">
        <form id="loginForm" action="#" method="post">
          <div class="form-group">
            <div class="input-group">
              <span class="input-group-addon"><span class="glyphicon glyphicon-user"></span></span>
              <input type="text" class="form-control" id="usuario" name="usuario" placeholder="Usuario" autocomplete="username" required>
            </div>
          </div>

          <div class="form-group">
            <div class="input-group">
              <span class="input-group-addon"><span class="glyphicon glyphicon-lock"></span></span>
              <input type="password" class="form-control" id="password" name="password" placeholder="Contraseña" autocomplete="current-password" required>
            </div>
          </div>

          <button type="submit" class="btn btn-login">Entrar</button>

          <div class="login-footer">
            <a href="#">¿Olvidaste tu contraseña?</a>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>
  <script>
    $(function () {
      $('#loginForm').on('submit', function (e) {
        e.preventDefault();
        var usuario = $('#usuario').val().trim();
        var password = $('#password').val().trim();

        if (!usuario || !password) {
          alert('Debes ingresar usuario y contraseña.');
          return;
        }

        alert('Bienvenido: ' + usuario);
      });
    });
  </script>
</body>
</html>
