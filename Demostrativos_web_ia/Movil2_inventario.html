<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Movil2 Inventario</title>
    <style>
      :root {
        --bg-1: #2f0404;
        --bg-2: #5e0d0d;
        --card: #fff6f6;
        --card-strong: #fff;
        --primary: #d62828;
        --primary-dark: #a30d0d;
        --primary-soft: #fbe3e3;
        --text: #2d1b1b;
        --muted: #7a5a5a;
        --success: #1f9d4b;
        --danger: #d62828;
        --shadow: 0 12px 32px rgba(70, 0, 0, 0.28);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(180deg, var(--bg-1), var(--bg-2));
        color: var(--text);
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 18px;
      }

      .app {
        width: min(100%, 430px);
        min-height: 760px;
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 24px;
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .screen {
        display: none;
        padding: 24px 18px 18px;
      }

      .screen.active {
        display: block;
      }

      .login-card,
      .form-card {
        background: var(--card);
        border-radius: 20px;
        padding: 22px 18px 18px;
      }

      .brand {
        text-align: center;
        margin-bottom: 18px;
      }

      .brand-badge {
        width: 72px;
        height: 72px;
        border-radius: 20px;
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 30px;
        font-weight: 700;
        margin: 0 auto 12px;
        box-shadow: 0 12px 24px rgba(214, 40, 40, 0.35);
      }

      h1, h2, h3, p { margin: 0; }

      .brand h1 {
        font-size: 1.8rem;
        color: var(--primary-dark);
      }

      .brand p {
        font-size: 0.82rem;
        color: var(--muted);
        margin-top: 6px;
      }

      .field {
        margin-top: 14px;
      }

      .field label {
        display: block;
        font-size: 0.8rem;
        color: var(--text);
        margin-bottom: 6px;
        font-weight: 700;
      }

      .field input,
      .field select,
      .field textarea {
        width: 100%;
        border: 1.5px solid #efb7b7;
        background: #fff;
        border-radius: 12px;
        padding: 14px 12px;
        font-size: 1rem;
        outline: none;
        transition: border-color .2s ease, box-shadow .2s ease;
      }

      .field input:focus,
      .field select:focus,
      .field textarea:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(214, 40, 40, 0.12);
      }

      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .checkbox-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 14px;
        color: var(--muted);
        font-size: 0.82rem;
      }

      .checkbox-row input {
        accent-color: var(--primary);
        width: 16px;
        height: 16px;
      }

      .btn {
        width: 100%;
        border: none;
        border-radius: 12px;
        padding: 14px 16px;
        font-weight: 700;
        font-size: 1rem;
        cursor: pointer;
        transition: transform .15s ease, opacity .15s ease;
      }

      .btn:active { transform: translateY(1px); }

      .btn-primary {
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        color: #fff;
        box-shadow: 0 10px 18px rgba(166, 20, 20, 0.28);
      }

      .btn-secondary {
        background: var(--primary-soft);
        color: var(--primary-dark);
      }

      .login-actions {
        margin-top: 18px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .helper {
        margin-top: 16px;
        text-align: center;
        font-size: 0.75rem;
        color: var(--muted);
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
      }

      .topbar .title {
        font-size: 1.1rem;
        font-weight: 700;
        color: #fff;
      }

      .chip {
        background: rgba(255,255,255,0.1);
        color: #fff;
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 999px;
        padding: 7px 12px;
        font-size: 0.74rem;
      }

      .summary {
        margin: 16px 0;
        background: linear-gradient(135deg, #ffe8e8, #fff1f1);
        border: 1px solid #f0bcbc;
        border-radius: 16px;
        padding: 12px 14px;
      }

      .summary-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        margin-top: 6px;
        color: var(--text);
        font-size: 0.9rem;
      }

      .summary-row strong {
        color: var(--primary-dark);
      }

      .transaction-type {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 16px;
      }

      .type-option {
        position: relative;
      }

      .type-option input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }

      .type-option label {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        border-radius: 12px;
        border: 1.5px solid #f0bcbc;
        background: #fff;
        color: var(--text);
        font-weight: 700;
        cursor: pointer;
      }

      .type-option input:checked + label {
        background: var(--primary);
        color: #fff;
        border-color: var(--primary);
        box-shadow: 0 8px 18px rgba(214, 40, 40, 0.24);
      }

      .bottom-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 18px;
      }

      @media (max-width: 380px) {
        .row, .bottom-actions, .transaction-type {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <section id="loginScreen" class="screen active">
        <div class="login-card">
          <div class="brand">
            <div class="brand-badge">M</div>
            <h1>Movil2</h1>
            <p>Inventario y movimientos</p>
          </div>

          <div class="field">
            <label for="usuario">Usuario</label>
            <input id="usuario" type="text" value="operador01" placeholder="Ingrese su usuario" />
          </div>

          <div class="field">
            <label for="password">Contraseña</label>
            <input id="password" type="password" value="123456" placeholder="Ingrese su contraseña" />
          </div>

          <label class="checkbox-row">
            <input type="checkbox" checked />
            <span>Recordarme</span>
          </label>

          <div class="login-actions">
            <button class="btn btn-primary" id="loginBtn">Iniciar sesión</button>
            <button class="btn btn-secondary" type="button">Solicitar acceso</button>
          </div>

          <div class="helper">Versión móvil · Inventario</div>
        </div>
      </section>

      <section id="transactionScreen" class="screen">
        <div class="topbar">
          <div class="title">Nueva transacción</div>
          <div class="chip">En línea</div>
        </div>

        <div class="form-card">
          <div class="field">
            <label for="codigo">Código / SKU</label>
            <input id="codigo" type="text" placeholder="Escanee o escriba el código" />
          </div>

          <div class="field">
            <label for="descripcion">Descripción</label>
            <input id="descripcion" type="text" value="Cinta adhesiva 2 pulgadas" />
          </div>

          <div class="row">
            <div class="field">
              <label for="cantidad">Cantidad</label>
              <input id="cantidad" type="number" min="1" value="12" />
            </div>
            <div class="field">
              <label for="bodega">Bodega</label>
              <select id="bodega">
                <option>Central</option>
                <option>Almacén A</option>
                <option>Almacén B</option>
              </select>
            </div>
          </div>

          <div class="transaction-type">
            <div class="type-option">
              <input type="radio" id="entrada" name="tipo" checked />
              <label for="entrada">Entrada</label>
            </div>
            <div class="type-option">
              <input type="radio" id="salida" name="tipo" />
              <label for="salida">Salida</label>
            </div>
          </div>

          <div class="summary">
            <div class="summary-row"><span>Existencia actual</span><strong>87 uds.</strong></div>
            <div class="summary-row"><span>Saldo estimado</span><strong>99 uds.</strong></div>
          </div>

          <div class="field">
            <label for="comentario">Observación</label>
            <textarea id="comentario" rows="3" placeholder="Detalle rápido de la operación"></textarea>
          </div>

          <div class="bottom-actions">
            <button class="btn btn-secondary" type="button" id="cancelBtn">Cancelar</button>
            <button class="btn btn-primary" type="button" id="saveBtn">Guardar</button>
          </div>
        </div>
      </section>
    </main>

    <script>
      const loginScreen = document.getElementById('loginScreen');
      const transactionScreen = document.getElementById('transactionScreen');
      const loginBtn = document.getElementById('loginBtn');
      const cancelBtn = document.getElementById('cancelBtn');
      const saveBtn = document.getElementById('saveBtn');

      loginBtn.addEventListener('click', function () {
        const usuario = document.getElementById('usuario').value.trim();
        const password = document.getElementById('password').value.trim();

        if (!usuario || !password) {
          alert('Ingrese usuario y contraseña.');
          return;
        }

        loginScreen.classList.remove('active');
        transactionScreen.classList.add('active');
      });

      cancelBtn.addEventListener('click', function () {
        transactionScreen.classList.remove('active');
        loginScreen.classList.add('active');
      });

      saveBtn.addEventListener('click', function () {
        const codigo = document.getElementById('codigo').value.trim();
        const cantidad = document.getElementById('cantidad').value.trim();

        if (!codigo || !cantidad) {
          alert('Complete el código y la cantidad antes de guardar.');
          return;
        }

        alert('Transacción registrada correctamente.');
      });
    </script>
  </body>
</html>
