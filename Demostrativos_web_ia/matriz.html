<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Tabla a matriz JavaScript</title>
</head>
<body>
	<table id="tabla">
		<thead>
			<tr>
				<th>Nombre</th>
				<th>Edad</th>
				<th>Ciudad</th>
			</tr>
		</thead>
		<tbody>
			<tr><td>Ana</td><td>25</td><td>Madrid</td></tr>
			<tr><td>Luis</td><td>31</td><td>Sevilla</td></tr>
			<tr><td>Marta</td><td>28</td><td>Valencia</td></tr>
		</tbody>
	</table>

	<button id="leerTabla">Guardar en matriz</button>
	<pre id="resultado"></pre>

	<script>
		function leerTablaComoMatriz(tabla) {
			return [...tabla.querySelectorAll('tr')].map(fila =>
				[...fila.querySelectorAll('th, td')].map(celda => celda.textContent.trim())
			);
		}

		document.getElementById('leerTabla').addEventListener('click', () => {
			const matriz = leerTablaComoMatriz(document.getElementById('tabla'));
			console.log(matriz);
			document.getElementById('resultado').textContent = JSON.stringify(matriz, null, 2);
		});
	</script>
</body>
</html>
