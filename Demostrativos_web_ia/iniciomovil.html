<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
  <style>
    :root {
      --rojo-principal: #d51f2a;
      --rojo-oscuro: #a7131d;
      --blanco: #ffffff;
      --gris-fondo: #efefef;
      --gris-texto: #555555;
      --gris-linea: #d9d9d9;
      --gris-oscuro: #333333;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #f5f5f5 0%, #e7e7e7 35%, #d2d2d2 100%);
      color: var(--gris-oscuro);
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.92);
      border-radius: 18px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.15);
      border: 1px solid rgba(0, 0, 0, 0.05);
      overflow: hidden;
    }

    .login-header {
      background: linear-gradient(135deg, var(--rojo-principal) 0%, var(--rojo-oscuro) 100%);
      color: var(--blanco);
      text-align: center;
      padding: 30px 20px 22px;
    }

    .login-logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 14px;
      border-radius: 50%;
      background: rgba(255,255,255,0.18);
      border: 2px solid rgba(255,255,255,0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: bold;
    }

    .login-header h2 {
      margin: 0;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .login-header p {
      margin: 8px 0 0;
      opacity: 0.9;
      font-size: 13px;
    }

    .login-body {
      padding: 30px 28px 24px;
      background: var(--blanco);
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-control {
      height: 46px;
      border-radius: 10px;
      border: 1px solid var(--gris-linea);
      background: #fafafa;
      box-shadow: none;
      font-size: 15px;
      padding: 10px 14px;
      transition: all 0.25s ease;
    }

    .form-control:focus {
      border-color: var(--rojo-principal);
      box-shadow: 0 0 0 3px rgba(213, 31, 42, 0.12);
      background: var(--blanco);
    }

    .checkbox {
      margin-top: 0;
      margin-bottom: 18px;
      color: var(--gris-texto);
      font-size: 13px;
    }

    .checkbox input[type="checkbox"] {
      margin-top: 2px;
    }

    .btn-login {
      width: 100%;
      height: 48px;
      border: 0;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--rojo-principal) 0%, #f13d3d 100%);
      color: var(--blanco);
      font-weight: 700;
      letter-spacing: 0.5px;
      font-size: 16px;
      transition: all 0.25s ease;
      box-shadow: 0 10px 18px rgba(213, 31, 42, 0.25);
    }

    .btn-login:hover,
    .btn-login:focus {
      background: linear-gradient(135deg, #c51824 0%, var(--rojo-principal) 100%);
      color: var(--blanco);
    }

    .links {
      margin-top: 18px;
      text-align: center;
      font-size: 13px;
      color: var(--gris-texto);
    }

    .links a {
      color: var(--rojo-principal);
      text-decoration: none;
      font-weight: 600;
    }

    .links a:hover {
      text-decoration: underline;
    }

    .divider {
      position: relative;
      margin: 20px 0 18px;
      text-align: center;
      color: #aaa;
      font-size: 12px;
      text-transform: uppercase;
    }

    .divider::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      border-top: 1px solid var(--gris-linea);
      z-index: 0;
    }

    .divider span {
      position: relative;
      z-index: 1;
      background: var(--blanco);
      padding: 0 12px;
    }

    .social-login {
      display: flex;
      gap: 10px;
    }

    .social-btn {
      flex: 1;
      border: 1px solid var(--gris-linea);
      border-radius: 10px;
      background: #f7f7f7;
      height: 42px;
      font-weight: 600;
      color: var(--gris-oscuro);
      transition: all 0.2s ease;
    }

    .social-btn:hover {
      background: #f0f0f0;
    }

    .alert-login {
      display: none;
      margin-top: 18px;
      margin-bottom: 0;
      border-radius: 10px;
      font-size: 13px;
    }

    @media (max-width: 480px) {
      body {
        padding: 12px;
      }

      .login-header {
        padding-top: 24px;
      }

      .login-header h2 {
        font-size: 24px;
      }

      .login-body {
        padding: 24px 18px 18px;
      }

      .social-login {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="login-header">
      <div class="login-logo">S</div>
      <h2>Bienvenido</h2>
      <p>Accede a tu cuenta</p>
    </div>

    <div class="login-body">
      <form id="loginForm">
        <div class="form-group">
          <label for="email" class="sr-only">Correo electrónico</label>
          <input type="email" class="form-control" id="email" placeholder="Correo electrónico" required>
        </div>

        <div class="form-group">
          <label for="password" class="sr-only">Contraseña</label>
          <input type="password" class="form-control" id="password" placeholder="Contraseña" required>
        </div>

        <div class="checkbox">
          <label>
            <input type="checkbox"> Recordarme
          </label>
        </div>

        <button type="submit" class="btn btn-login">Iniciar sesión</button>

        <div class="alert alert-login" id="loginAlert"></div>

        <div class="divider"><span>o</span></div>

        <div class="social-login">
          <button type="button" class="social-btn">Google</button>
          <button type="button" class="social-btn">Facebook</button>
        </div>

        <div class="links">
          <p>¿Olvidaste tu contraseña? <a href="#">Recuperar</a></p>
          <p>¿No tienes cuenta? <a href="#">Regístrate</a></p>
        </div>
      </form>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>
  <script>
    $(function () {
      $('#loginForm').on('submit', function (e) {
        e.preventDefault();

        var email = $('#email').val().trim();
        var password = $('#password').val().trim();
        var alertBox = $('#loginAlert');

        if (!email || !password) {
          alertBox
            .removeClass('alert-success')
            .addClass('alert-danger')
            .text('Por favor completa todos los campos.')
            .show();
          return;
        }

        alertBox
          .removeClass('alert-danger')
          .addClass('alert-success')
          .text('¡Acceso correcto! Redirigiendo...')
          .show();

        setTimeout(function () {
          alertBox.hide();
        }, 2500);
      });
    });
  </script>
</body>
</html>
