<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Formulario de inventario</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
	<main class="container py-3">
		<div class="card border-0 shadow-sm mx-auto" style="max-width: 520px;">
			<div class="card-body p-4">
				<h1 class="h4 mb-4">Registro de inventario</h1>
				<form>
					<div class="mb-3">
						<label for="codigo" class="form-label">Código</label>
						<input type="text" class="form-control" id="codigo" name="codigo" placeholder="Ej. INV-001" required>
					</div>

					<div class="mb-3">
						<label for="nombre" class="form-label">Nombre del artículo</label>
						<input type="text" class="form-control" id="nombre" name="nombre" required>
					</div>

					<div class="mb-3">
						<label for="estado" class="form-label">Estado</label>
						<select class="form-select" id="estado" name="estado" required>
							<option value="" selected disabled>Selecciona un estado</option>
							<option value="nuevo">Nuevo</option>
							<option value="bueno">Bueno</option>
							<option value="regular">Regular</option>
							<option value="danado">Dañado</option>
							<option value="fuera-servicio">Fuera de servicio</option>
						</select>
					</div>

					<fieldset class="mb-3">
						<legend class="form-label fs-6">Situación</legend>
						<div class="d-grid gap-2">
							<div class="form-check">
								<input class="form-check-input" type="radio" name="situacion" id="disponible" value="disponible" required>
								<label class="form-check-label" for="disponible">Disponible</label>
							</div>
							<div class="form-check">
								<input class="form-check-input" type="radio" name="situacion" id="asignado" value="asignado">
								<label class="form-check-label" for="asignado">Asignado</label>
							</div>
							<div class="form-check">
								<input class="form-check-input" type="radio" name="situacion" id="mantenimiento" value="mantenimiento">
								<label class="form-check-label" for="mantenimiento">En mantenimiento</label>
							</div>
							<div class="form-check">
								<input class="form-check-input" type="radio" name="situacion" id="baja" value="baja">
								<label class="form-check-label" for="baja">De baja</label>
							</div>
						</div>
					</fieldset>

					<div class="mb-4">
						<label for="observaciones" class="form-label">Observaciones</label>
						<textarea class="form-control" id="observaciones" name="observaciones" rows="3" placeholder="Información adicional"></textarea>
					</div>

					<div class="d-grid">
						<button type="submit" class="btn btn-primary btn-lg">Guardar registro</button>
					</div>
				</form>
			</div>
		</div>
	</main>
</body>
</html>
