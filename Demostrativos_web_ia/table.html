<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Tabla responsive</title>
	<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
	<style>
		body { padding-top: 20px; background: #f5f5f5; }
		.app { max-width: 900px; margin: 0 auto; }
		.panel-heading { font-size: 18px; }
		@media (max-width: 767px) {
			body { padding-top: 10px; }
			.panel-heading { font-size: 16px; }
			.table { min-width: 620px; }
		}
	</style>
</head>
<body>
	<main class="container app">
		<div class="panel panel-primary">
			<div class="panel-heading">
				<span class="glyphicon glyphicon-list-alt" aria-hidden="true"></span>
				Tabla de usuarios
			</div>
			<div class="panel-body">
				<p class="text-muted">Desliza horizontalmente en dispositivos móviles.</p>
				<div class="table-responsive">
					<table class="table table-striped table-hover table-bordered">
						<thead>
							<tr>
								<th>#</th>
								<th>Nombre</th>
								<th>Correo</th>
								<th>Rol</th>
								<th>Estado</th>
							</tr>
						</thead>
						<tbody>
							<tr>
								<td>1</td>
								<td>Ana García</td>
								<td>ana@ejemplo.com</td>
								<td>Administradora</td>
								<td><span class="label label-success">Activo</span></td>
							</tr>
							<tr>
								<td>2</td>
								<td>Carlos López</td>
								<td>carlos@ejemplo.com</td>
								<td>Editor</td>
								<td><span class="label label-success">Activo</span></td>
							</tr>
							<tr>
								<td>3</td>
								<td>María Pérez</td>
								<td>maria@ejemplo.com</td>
								<td>Colaboradora</td>
								<td><span class="label label-default">Inactivo</span></td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
		</div>
	</main>
</body>
</html>
