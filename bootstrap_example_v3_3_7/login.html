<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Formulário de Login</title>
	<style>
		* { box-sizing: border-box; }
		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			font-family: Arial, sans-serif;
			background: #f1f5f9;
			color: #1e293b;
		}
		.login {
			width: min(100% - 2rem, 400px);
			padding: 2rem;
			background: #fff;
			border-radius: 12px;
			box-shadow: 0 8px 25px rgba(15, 23, 42, .1);
		}
		h1 { margin: 0 0 1.5rem; text-align: center; font-size: 1.6rem; }
		label { display: block; margin: 1rem 0 .4rem; font-weight: 600; }
		input {
			width: 100%;
			padding: .75rem;
			border: 1px solid #cbd5e1;
			border-radius: 6px;
			font-size: 1rem;
		}
		input:focus { outline: 2px solid #2563eb; border-color: transparent; }
		button {
			width: 100%;
			margin-top: 1.5rem;
			padding: .8rem;
			border: 0;
			border-radius: 6px;
			background: #2563eb;
			color: #fff;
			font-size: 1rem;
			font-weight: 600;
			cursor: pointer;
		}
		button:hover { background: #1d4ed8; }
		.forgot { display: block; margin-top: 1rem; text-align: center; color: #2563eb; }
	</style>
</head>
<body>
	<main class="login">
		<h1>Entrar</h1>
		<form action="#" method="post">
			<label for="email">E-mail</label>
			<input type="email" id="email" name="email" autocomplete="email" required>

			<label for="senha">Senha</label>
			<input type="password" id="senha" name="senha" autocomplete="current-password" required>

			<button type="submit">Acessar</button>
			<a class="forgot" href="#">Esqueci minha senha</a>
		</form>
	</main>
</body>
</html>
