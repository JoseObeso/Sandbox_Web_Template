  --color-gl-muted: #e2e5ef;

<body>
<div id="root"></div>
<script type="text/babel" data-type="module" data-presets="react-automatic">
// snippet:jsx
// Frosted-glass login card over drifting colour blobs (the drift stops under prefers-reduced-motion).
// Usage: <GlassLogin onSubmit={({ email, password }) => signIn(email, password)} />
import { useState, useId } from 'react';

const inputCls = 'mb-[18px] block w-full rounded-[11px] border border-white/42 bg-white/6 px-3.5 py-3 text-[.95rem] text-white transition-[border-color,background-color,box-shadow] duration-150 placeholder:text-[#c8cddd] focus:border-white/85 focus:bg-white/10 focus:shadow-[0_0_0_3px_rgba(255,255,255,.18)] focus:outline-none motion-reduce:transition-none';
const labelCls = 'mb-[7px] block text-[.8rem] font-semibold text-[#c8cddd]';
const blobCls = 'pointer-events-none absolute rounded-full opacity-55 blur-[90px]';

export default function GlassLogin({
  title = 'Sign in',
  subtitle = 'Welcome back — we kept your seat warm.',
  submitLabel = 'Enter dashboard',
  signupHref = '#',
  onSubmit = () => {},
}) {
  const id = useId();
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');

  function handleSubmit(e) {
    e.preventDefault();
    onSubmit({ email, password });
  }

  return (
    <div className="relative flex min-h-screen items-center justify-center overflow-hidden bg-gl-bg p-6 font-[-apple-system,BlinkMacSystemFont,'Segoe_UI',Roboto,Helvetica,Arial,sans-serif] leading-[normal] text-[#eef0f6]">
      <div className={`${blobCls} -top-[120px] -left-20 size-[420px] bg-[#6d28d9] motion-safe:animate-gl-drift`} aria-hidden="true" />
      <div className={`${blobCls} -right-[60px] -bottom-[100px] size-[380px] bg-[#0ea5e9] motion-safe:animate-[gl-drift_17s_ease-in-out_infinite_alternate-reverse]`} aria-hidden="true" />
      <div className={`${blobCls} bottom-[20%] left-[12%] size-[260px] bg-[#db2777] motion-safe:animate-[gl-drift_21s_ease-in-out_infinite_alternate]`} aria-hidden="true" />
      <form className="relative z-10 w-full max-w-[380px] rounded-[22px] border border-white/16 bg-[#070d1e]/72 px-[38px] py-11 shadow-[0_24px_60px_rgba(0,0,0,.45)] backdrop-blur-[22px]" action="#" method="post" onSubmit={handleSubmit}>
        <h1 className="mb-1.5 text-center text-[1.55rem] font-bold tracking-[-.02em]">{title}</h1>
        <p className="mb-[30px] text-center text-[.9rem] text-gl-muted">{subtitle}</p>
        <label className={labelCls} htmlFor={`${id}-email`}>Email</label>
        <input className={inputCls} type="email" id={`${id}-email`} name="email" placeholder="you@example.com" autoComplete="username" required
          value={email} onChange={(e) => setEmail(e.target.value)} />
        <label className={labelCls} htmlFor={`${id}-password`}>Password</label>
        <input className={inputCls} type="password" id={`${id}-password`} name="password" placeholder="Your password" autoComplete="current-password" required
          value={password} onChange={(e) => setPassword(e.target.value)} />
        <button className="mt-1.5 w-full cursor-pointer rounded-[11px] bg-linear-90 from-[#e0e7ff] to-white p-[13px] text-[.95rem] font-bold text-gl-bg transition-[transform,box-shadow] duration-150 hover:-translate-y-px hover:shadow-[0_10px_26px_rgba(255,255,255,.18)] focus-visible:outline-2 focus-visible:outline-offset-3 focus-visible:outline-white motion-reduce:transition-none motion-reduce:hover:translate-y-0" type="submit">{submitLabel}</button>
        <p className="mt-[22px] text-center text-[.85rem] text-gl-muted">First time here? <a className="rounded-[3px] border-b border-white/50 font-semibold text-white hover:border-white focus-visible:outline-2 focus-visible:outline-offset-3 focus-visible:outline-white" href={signupHref}>Create an account</a></p>
      </form>
    </div>
  );
}
// /snippet:jsx
import { createRoot } from 'react-dom/client';
createRoot(document.getElementById('root')).render(<GlassLogin />);
</script>
</body></html>
