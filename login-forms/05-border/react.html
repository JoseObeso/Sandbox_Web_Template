<body>
<div id="root"></div>
<script type="text/babel" data-type="module" data-presets="react-automatic">
// snippet:jsx
// Login card inside an animated gradient border (the slide stops under prefers-reduced-motion).
// Usage: <GradientBorderLogin badge="Members area" onSubmit={({ email, password }) => signIn(email, password)} />
import { useState, useId } from 'react';

const inputCls = 'mb-[18px] block w-full rounded-xl border-[1.5px] border-gb-line bg-white px-3.5 py-3 text-[.95rem] transition-[border-color,box-shadow] duration-150 placeholder:text-gb-muted focus:border-gb-pink focus:shadow-[0_0_0_3px_rgba(219,39,119,.2)] focus:outline-none motion-reduce:transition-none';
const labelCls = 'mb-1.5 block text-[.83rem] font-bold';
const linkCls = 'rounded-[3px] font-bold text-gb-pink hover:underline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-gb-pink';

export default function GradientBorderLogin({
  badge = 'Members area',
  title = 'Good to see you again',
  subtitle = 'Log in to pick up right where you left off.',
  forgotHref = '#',
  signupHref = '#',
  onSubmit = () => {},
}) {
  const id = useId();
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');

  function handleSubmit(e) {
    e.preventDefault();
    onSubmit({ email, password });
  }

  return (
    <div className="flex min-h-screen items-center justify-center bg-[#fdf6f0] p-6 font-[-apple-system,BlinkMacSystemFont,'Segoe_UI',Roboto,Helvetica,Arial,sans-serif] leading-[normal] text-gb-ink">
      <div className="w-full max-w-[390px] rounded-[20px] bg-[linear-gradient(120deg,#f97316,#db2777,#8b5cf6,#f97316)] bg-size-[300%_300%] p-0.5 motion-safe:animate-gb-slide">
        <form className="rounded-[18px] bg-[#fffdfb] px-9 py-[42px]" action="#" method="post" onSubmit={handleSubmit}>
          {badge && <span className="mb-4 inline-block rounded-full bg-[#fdeef5] px-3 py-[5px] text-[.72rem] font-bold tracking-[.08em] text-[#be185d] uppercase">{badge}</span>}
          <h1 className="mb-1.5 text-[1.55rem] font-bold tracking-[-.02em]">{title}</h1>
          <p className="mb-7 text-[.92rem] text-gb-muted">{subtitle}</p>
          <label className={labelCls} htmlFor={`${id}-email`}>Email</label>
          <input className={inputCls} type="email" id={`${id}-email`} name="email" placeholder="you@example.com" autoComplete="username" required
            value={email} onChange={(e) => setEmail(e.target.value)} />
          <label className={labelCls} htmlFor={`${id}-password`}>Password</label>
          <input className={inputCls} type="password" id={`${id}-password`} name="password" autoComplete="current-password" required
            value={password} onChange={(e) => setPassword(e.target.value)} />
          <button className="w-full cursor-pointer rounded-xl bg-linear-90 from-[#c2410c] to-[#db2777] p-[13px] text-[.95rem] font-extrabold text-white transition-[filter,transform] duration-150 hover:-translate-y-px hover:brightness-106 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-gb-pink motion-reduce:transition-none motion-reduce:hover:translate-y-0" type="submit">Log in</button>
          <div className="mt-5 flex flex-wrap justify-between gap-3 text-[.85rem]">
            <a className={linkCls} href={forgotHref}>Forgot password?</a>
            <a className={linkCls} href={signupHref}>Create account</a>
          </div>
        </form>
      </div>
    </div>
  );
}
// /snippet:jsx
import { createRoot } from 'react-dom/client';
createRoot(document.getElementById('root')).render(<GradientBorderLogin />);
</script>
</body></html>
