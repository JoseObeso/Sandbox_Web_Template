<script type="text/babel" data-type="module" data-presets="react-automatic">
// snippet:jsx
// Neobrutalist login: thick ink borders, hard offset shadows, inputs that lift on focus.
// Usage: <BrutalLogin onSubmit={({ email, password }) => signIn(email, password)} />
import { useState, useId } from 'react';

const inputCls = 'mb-[18px] block w-full rounded-[10px] border-3 border-nb-ink bg-white px-3.5 py-3 text-[.95rem] font-semibold transition-[box-shadow,transform] duration-[120ms] placeholder:text-[#666] focus:-translate-x-0.5 focus:-translate-y-0.5 focus:shadow-[4px_4px_0_var(--color-nb-ink)] focus:outline-none motion-reduce:transition-none motion-reduce:focus:translate-none';
const labelCls = 'mb-1.5 block text-[.85rem] font-extrabold tracking-[.03em] uppercase';
const linkCls = 'rounded underline decoration-nb-violet decoration-3 underline-offset-3 hover:decoration-nb-green focus-visible:outline-3 focus-visible:outline-offset-3 focus-visible:outline-nb-ink';

function Field({ label, ...inputProps }) {
  const id = useId();
  return (
    <>
      <label className={labelCls} htmlFor={id}>{label}</label>
      <input className={inputCls} id={id} {...inputProps} />
    </>
  );
}

export default function BrutalLogin({ badge = 'Members only', lostHref = '#', joinHref = '#', onSubmit = () => {} }) {
  const [form, setForm] = useState({ email: '', password: '' });
  const update = (e) => setForm({ ...form, [e.target.name]: e.target.value });

  function handleSubmit(e) {
    e.preventDefault();
    onSubmit(form);
  }

  return (
    <div className="flex min-h-screen items-center justify-center bg-nb-yellow bg-[radial-gradient(#00000012_1.5px,transparent_1.5px)] bg-size-[22px_22px] p-6 font-[-apple-system,BlinkMacSystemFont,'Segoe_UI',Roboto,Helvetica,Arial,sans-serif] leading-[normal] text-nb-ink">
      <form className="w-full max-w-[400px] rounded-[14px] border-3 border-nb-ink bg-white px-[34px] py-[38px] shadow-[8px_8px_0_var(--color-nb-ink)]" action="#" method="post" onSubmit={handleSubmit}>
        <span className="mb-[18px] inline-block rounded-lg border-3 border-nb-ink bg-nb-violet px-2.5 py-[5px] text-xs font-extrabold tracking-[.05em] uppercase shadow-[3px_3px_0_var(--color-nb-ink)]">{badge}</span>
        <h1 className="mb-1.5 text-[1.8rem] font-black tracking-[-.03em]">Log in.</h1>
        <p className="mb-[26px] text-[.92rem] font-semibold text-[#444]">No fluff. Just your inbox and your work.</p>
        <Field label="Email" type="email" name="email" placeholder="you@example.com" autoComplete="username" required value={form.email} onChange={update} />
        <Field label="Password" type="password" name="password" placeholder="Top secret" autoComplete="current-password" required value={form.password} onChange={update} />
        <button className="w-full cursor-pointer rounded-[10px] border-3 border-nb-ink bg-nb-green p-3.5 text-base font-black tracking-[.04em] uppercase shadow-[5px_5px_0_var(--color-nb-ink)] transition-[box-shadow,transform] duration-[120ms] hover:translate-x-0.5 hover:translate-y-0.5 hover:shadow-[2px_2px_0_var(--color-nb-ink)] focus-visible:outline-3 focus-visible:outline-offset-3 focus-visible:outline-nb-ink active:translate-x-[5px] active:translate-y-[5px] active:shadow-none motion-reduce:transition-none motion-reduce:hover:translate-none motion-reduce:active:translate-none" type="submit">Let me in <span aria-hidden="true">→</span></button>
        <div className="mt-[22px] flex flex-wrap justify-between gap-3 text-[.85rem] font-extrabold">
          <a className={linkCls} href={lostHref}>Lost password</a>
          <a className={linkCls} href={joinHref}>Join instead</a>
        </div>
      </form>
    </div>
  );
}
// /snippet:jsx
import { createRoot } from 'react-dom/client';
createRoot(document.getElementById('root')).render(<BrutalLogin />);
</script>
</body></html>
